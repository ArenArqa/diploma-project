[project]
name = "smart-car-marketplace"
version = "0.1.0"
description = "Armenian car marketplace with explainable valuation and safe rentals"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "redis>=5.2,<7",
  "celery[redis]>=5.4,<6", "numpy>=2.2,<3", "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1", "python-multipart>=0.0.20,<1", "pillow>=11.1,<13"
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL and TEST_REDIS_URL", "smoke: end-to-end API scenario"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
